name: Naiwa Bot Tests

on:
  push:
    paths: ['instagram-bot/**', '.github/workflows/naiwa-bot*.yml']
    branches-ignore: [naiwa-bot-state]
  pull_request:
    paths: ['instagram-bot/**', '.github/workflows/naiwa-bot*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: instagram-bot/requirements-dev.txt
      - run: python -m pip install -r instagram-bot/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: instagram-bot
